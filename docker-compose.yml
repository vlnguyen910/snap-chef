version: "3.8"
services:
  snap-chef-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: snap-chef-db
    volumes:
      - snap_chef_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:12345@snap-chef-db:5432/snap-chef-db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_PORT=8080
    env_file:
      - apps/api/.env
    depends_on:
      - snap-chef-db
      - redis

volumes:
  snap_chef_data:
  redis_data:
